spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  web-push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:support@jkcqplan.com}
  data-encryption:
    key: ${DATA_ENCRYPTION_KEY}
    key-version: ${DATA_ENCRYPTION_KEY_VERSION:1}
  oss:
    access-key-id: ""
    secret-access-key: ""
    local-path: ${APP_FILES_STORAGE_PATH:./.appdata/storage}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  sms:
    enabled: ${SMS_ENABLED:false}
    debug-code-enabled: ${SMS_DEBUG_CODE_ENABLED:false}
  ai:
    chat-order: [qwen]
    vision-provider: ${AI_CHAT_VISION_PROVIDER:qwen}
    daily-limit: ${AI_CHAT_DAILY_LIMIT:30}
    timeout-seconds: ${AI_CHAT_TIMEOUT_SECONDS:120}
    plan-cache-minutes: ${AI_PLAN_CACHE_MINUTES:30}
    plan-max-completion-tokens: ${AI_PLAN_MAX_COMPLETION_TOKENS:8192}
    providers:
      deepseek:
        base-url: ${AI_CHAT_DEEPSEEK_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
        model: ${AI_CHAT_DEEPSEEK_MODEL:deepseek-v4-pro-260425}
        api-key: ${AI_CHAT_VOLCENGINE_API_KEY:}
      doubao:
        base-url: ${AI_CHAT_DOUBAO_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
        model: ${AI_CHAT_DOUBAO_MODEL:doubao-seed-2-1-pro-260628}
        api-key: ${AI_CHAT_VOLCENGINE_API_KEY:}
      glm:
        base-url: ${AI_CHAT_GLM_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
        model: ${AI_CHAT_GLM_MODEL:glm-5-2-260617}
        api-key: ${AI_CHAT_VOLCENGINE_API_KEY:}
      qwen:
        base-url: ${AI_CHAT_QWEN_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${AI_CHAT_QWEN_MODEL:qwen3.7-plus}
        api-key: ${AI_CHAT_QWEN_API_KEY:}

logging:
  level:
    root: INFO
    io.healthresetplan: INFO

server:
  forward-headers-strategy: framework
