spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,filesystem:./sql/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        api-key: ${DEEPSEEK_API_KEY}
      doubao:
        base-url: https://ark.cn-beijing.volces.com/api/v3
        model: ${DOUBAO_MODEL:doubao-pro-32k}
        api-key: ${DOUBAO_API_KEY}
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: ${QWEN_MODEL:qwen-plus}
        api-key: ${QWEN_API_KEY}

logging:
  level:
    root: INFO
    io.healthresetplan: INFO
