spring:
  datasource:
    url: jdbc:mysql://localhost:3306/health_reset_plan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,filesystem:./sql/migration
    table: flyway_schema_history
    encoding: UTF-8

app:
  files:
    # 加密文件本地存储根目录（后续可换 OSS，只改此处）
    storage-path: ${FILES_STORAGE_PATH:/home/lyt/hrp-uploads}
  jwt:
    secret: ${JWT_SECRET:replace-me-in-real-env-please-replace-me-please}
    # 开发环境：access 100 年、refresh 100 年，相当于不过期；生产环境请改回合理值
    access-ttl-minutes: 52560000
    refresh-ttl-days: 36500
  ai:
    # 对话/计划生成厂商优先级：依次尝试，失败自动降级
    chat-order: [qwen, doubao, deepseek]
    # 体检报告 OCR 使用的视觉模型厂商
    vision-provider: qwen
    # 单用户每日最大 AI 请求次数
    daily-limit: 30
    # 请求超时秒数
    timeout-seconds: 120
    providers:
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen-turbo
        api-key: ${QWEN_API_KEY:}
      doubao:
        base-url: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-lite-32k
        api-key: ${DOUBAO_API_KEY:}
      deepseek:
        base-url: https://api.deepseek.com
        model: deepseek-chat
        api-key: ${DEEPSEEK_API_KEY:}
