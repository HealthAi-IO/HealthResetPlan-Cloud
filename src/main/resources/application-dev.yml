spring:
  datasource:
    url: jdbc:mysql://localhost:3307/health_reset_plan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

app:
  payment:
    order-expire-minutes: ${PAYMENT_ORDER_EXPIRE_MINUTES:15}
    refund-window-days: ${PAYMENT_REFUND_WINDOW_DAYS:7}
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
    alipay:
      enabled: ${ALIPAY_ENABLED:false}
  web-push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:support@jkcqplan.com}
  data-encryption:
    key: ${DATA_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    key-version: ${DATA_ENCRYPTION_KEY_VERSION:1}
  oss:
    access-key-id: ${JDCLOUD_OSS_ACCESS_KEY_ID:}
    secret-access-key: ${JDCLOUD_OSS_SECRET_ACCESS_KEY:}
    region: ${JDCLOUD_OSS_REGION:cn-north-1}
    endpoint: ${JDCLOUD_OSS_ENDPOINT:https://s3-internal.cn-north-1.jdcloud-oss.com}
    bucket: ${JDCLOUD_OSS_BUCKET:health-reset-plan-private}
  jwt:
    secret: ${JWT_SECRET:replace-me-in-real-env-please-replace-me-please}
    # 开发环境：access 100 年、refresh 100 年，相当于不过期；生产环境请改回合理值
    access-ttl-minutes: 52560000
    refresh-ttl-days: 36500
  sms:
    enabled: ${SMS_ENABLED:false}
    debug-code-enabled: ${SMS_DEBUG_CODE_ENABLED:true}
    provider: jdcloud
    region-id: ${SMS_REGION_ID:cn-north-1}
    code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:600}
    resend-interval-seconds: ${SMS_RESEND_INTERVAL_SECONDS:60}
    max-per-phone-per-hour: ${SMS_MAX_PER_PHONE_PER_HOUR:5}
    max-per-phone-per-day: ${SMS_MAX_PER_PHONE_PER_DAY:20}
    jdcloud:
      access-key-id: ${JDCLOUD_ACCESS_KEY_ID:}
      secret-access-key: ${JDCLOUD_SECRET_ACCESS_KEY:}
      sign-id: ${JDCLOUD_SMS_SIGN_ID:}
      template-id: ${JDCLOUD_SMS_TEMPLATE_ID:mb_cd5b4c717b484fa9a89c79de263782bf}
      endpoint: ${JDCLOUD_SMS_ENDPOINT:sms.jdcloud-api.com}
      connect-timeout-millis: ${JDCLOUD_SMS_CONNECT_TIMEOUT_MILLIS:3000}
      read-timeout-millis: ${JDCLOUD_SMS_READ_TIMEOUT_MILLIS:5000}
  ai:
    # 未指定模型时使用列表首项；请求失败不会跨模型自动降级
    chat-order: [qwen]
    # 体检报告 OCR 使用的视觉模型厂商
    vision-provider: qwen
    # 单用户每日最大 AI 请求次数
    daily-limit: 30
    # 请求超时秒数
    timeout-seconds: 120
    # 7 天健康规划：短期缓存同一档案请求，并限制输出长度来提高速度
    plan-cache-minutes: ${AI_PLAN_CACHE_MINUTES:30}
    plan-max-completion-tokens: ${AI_PLAN_MAX_COMPLETION_TOKENS:8192}
    providers:
      qwen:
        base-url: ${AI_CHAT_QWEN_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${AI_CHAT_QWEN_MODEL:qwen3.7-plus}
      doubao:
        base-url: ${AI_CHAT_DOUBAO_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
        model: ${AI_CHAT_DOUBAO_MODEL:doubao-seed-2-1-pro-260628}
      glm:
        base-url: ${AI_CHAT_GLM_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
        model: ${AI_CHAT_GLM_MODEL:glm-5-2-260617}
      deepseek:
        base-url: ${AI_CHAT_DEEPSEEK_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
        model: ${AI_CHAT_DEEPSEEK_MODEL:deepseek-v4-pro-260425}
