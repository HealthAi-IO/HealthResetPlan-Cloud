spring:
  datasource:
    url: jdbc:mysql://localhost:3306/health_reset_plan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:healthrp}
    password: ${DB_PASSWORD:healthrp}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,filesystem:./sql/migration
    table: flyway_schema_history
    encoding: UTF-8

app:
  jwt:
    secret: ${JWT_SECRET:replace-me-in-real-env-please-replace-me-please}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  ai:
    default-provider: deepseek
    vision-provider: qwen-vl
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        model: deepseek-chat
        api-key: ${DEEPSEEK_API_KEY:}
      doubao:
        base-url: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-pro-32k
        api-key: ${DOUBAO_API_KEY:}
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen-plus
        api-key: ${QWEN_API_KEY:}
      qwen-vl:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen-vl-plus
        api-key: ${QWEN_API_KEY:}
