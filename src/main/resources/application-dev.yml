spring:
  datasource:
    url: jdbc:mysql://localhost:3306/health_reset_plan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:healthrp}
    password: ${DB_PASSWORD:healthrp}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,filesystem:./sql/migration
    table: flyway_schema_history
    encoding: UTF-8

app:
  files:
    # 加密文件本地存储根目录（后续可换 OSS，只改此处）
    storage-path: ${FILES_STORAGE_PATH:/home/lyt/hrp-uploads}
  jwt:
    secret: ${JWT_SECRET:replace-me-in-real-env-please-replace-me-please}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  ai:
    one-api:
      # 本地 OneAPI 实例地址（不带 /v1 结尾，SDK 自动补全）
      base-url: ${ONE_API_BASE_URL:http://localhost:3000}
      # OneAPI 统一接入 key（在 OneAPI 控制台 → 令牌 中创建）
      api-key: ${ONE_API_KEY:sk-HealthResetPlan}
      # 对话/计划生成模型优先级（依次降级）
      chat-models:
        - qwen-turbo
        - doubao-lite
        - deepseek-chat
      # 体检报告 OCR 视觉模型
      vision-model: ${ONE_API_VISION_MODEL:qwen-vl-plus}
      # 单用户每日最大请求次数（与 OneAPI 后台配置保持一致）
      daily-limit: 30
      # 请求超时秒数
      timeout-seconds: 90
