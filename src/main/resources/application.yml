spring:
  application:
    name: health-reset-plan-cloud
  config:
    import: optional:file:${HEALTH_LOCAL_CONFIG:./application-local.yml}
  profiles:
    active: dev,local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deletedAt
      logic-delete-value: NOW()
      logic-not-delete-value: 'NULL'

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  file:
    path: ${LOG_PATH:./logs}
    name: ${LOG_FILE:${logging.file.path}/${spring.application.name}.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATTERN:${logging.file.path}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:2GB}
  level:
    io.healthresetplan: INFO
    org.springframework.security: INFO

app:
  social-auth:
    wechat:
      enabled: ${WECHAT_LOGIN_ENABLED:false}
      app-id: ${WECHAT_LOGIN_APP_ID:}
      app-secret: ${WECHAT_LOGIN_APP_SECRET:}
  payment:
    order-expire-minutes: ${PAYMENT_ORDER_EXPIRE_MINUTES:15}
    refund-window-days: ${PAYMENT_REFUND_WINDOW_DAYS:7}
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_PAY_APP_ID:}
      merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      platform-certificate-path: ${WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:https://api.jkcqplan.com/api/v1/payments/wechat/notify}
    alipay:
      enabled: ${ALIPAY_ENABLED:false}
      app-id: ${ALIPAY_APP_ID:}
      private-key-path: ${ALIPAY_PRIVATE_KEY_PATH:}
      alipay-public-key-path: ${ALIPAY_PUBLIC_KEY_PATH:}
      notify-url: ${ALIPAY_NOTIFY_URL:https://api.jkcqplan.com/api/v1/payments/alipay/notify}
      gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
